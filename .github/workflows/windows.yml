name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testar-e-compilar:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt pytest pyinstaller

      - name: Testes (inclui roda, hook do Mouse 4, PrtSc, ícones e área de transferência)
        run: python -m pytest -v tests

      - name: Gerar Mira.exe
        run: python build_exe.py

      - name: Testar o Mira.exe (abre, espera e confere o log)
        shell: pwsh
        run: |
          $p = Start-Process dist\Mira.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Host "O Mira.exe fechou sozinho"; Get-Content dist\mira.log -ErrorAction SilentlyContinue; exit 1 }
          Stop-Process -Id $p.Id -Force
          Get-Content dist\mira.log
          if (-not (Select-String -Path dist\mira.log -Pattern "Mira iniciado" -Quiet)) { exit 1 }

      - name: Prints dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prints-dos-testes
          path: tests/artifacts

      - name: Mira.exe
        uses: actions/upload-artifact@v4
        with:
          name: Mira-exe
          path: dist/Mira.exe
